name: Benchmark Temu market sources

on:
  push:
    branches:
      - feature/temu-market-benchmark
    paths:
      - 'scripts/benchmark_market_sources_v2.js'
      - '.github/workflows/benchmark-market-sources.yml'
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma-separated providers: firecrawl,tavily,exa'
        required: false
        default: 'firecrawl'
      result_limit:
        description: 'Results per query'
        required: false
        default: '10'
      quote_markup_cny:
        description: 'Provisional markup added to factory floor price'
        required: false
        default: '4'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCHMARK_PROVIDERS: ${{ inputs.providers || 'firecrawl' }}
      BENCHMARK_RESULT_LIMIT: ${{ inputs.result_limit || '10' }}
      DEFAULT_QUOTE_MARKUP_CNY: ${{ inputs.quote_markup_cny || '4' }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run strict market source benchmark
        run: node scripts/benchmark_market_sources_v2.js

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temu-market-source-benchmark-v2-${{ github.run_number }}
          path: data/benchmarks/market-source-latest-v2.json
          if-no-files-found: warn
          retention-days: 14
