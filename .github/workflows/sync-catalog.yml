name: Daily selection refresh

on:
  schedule:
    # Planned 00:15 UTC = 08:15 Asia/Shanghai; GitHub may delay execution.
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the application branch workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync-catalog.yml',
              ref: 'feature/catalog-sync-dashboard'
            });
