name: Sync selection catalog

on:
  push:
    branches:
      - feature/catalog-sync-dashboard
      - master
  schedule:
    # Scheduled workflows only run from the repository default branch.
    # 19:15 UTC = 03:15 Asia/Shanghai next day.
    - cron: '15 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selection-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEFAULT_QUOTE_MARKUP_CNY: '4'
      MARKET_DEEP_DIVE_LIMIT: '20'
      COARSE_SCREEN_MAX_PER_CATEGORY: '2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and validate catalog
        run: npm run sync

      - name: Build supply-side coarse screen
        run: npm run screen

      - name: Run tests
        run: npm test

      - name: Build internal dashboard
        run: npm run build

      - name: Upload internal dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanpin-dashboard-${{ github.run_number }}
          path: dist
          retention-days: 30

      - name: Commit validated data outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/catalog.json \
            public/data/sync-meta.json \
            public/data/products.csv \
            public/data/selection-report.md \
            public/data/coarse-screen.json \
            public/data/coarse-screen.csv \
            public/data/coarse-screen.md \
            data/history.json
          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): sync catalog and coarse screen [skip ci]"
          git push
