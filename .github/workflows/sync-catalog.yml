name: Sync selection catalog

on:
  push:
    branches:
      - feature/catalog-sync-dashboard
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selection-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEFAULT_QUOTE_MARKUP_CNY: '4'
      MARKET_DEEP_DIVE_LIMIT: '20'
      COARSE_SCREEN_MAX_PER_CATEGORY: '2'
      DAILY_SCHEDULE_ACTIVE: 'true'
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v4
        with:
          ref: feature/catalog-sync-dashboard
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync, rank, test and build with last known good fallback
        id: pipeline
        continue-on-error: true
        run: node scripts/daily_pipeline.js

      - name: Upload dashboard including current sync status
        if: always() && hashFiles('dist/release.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xuanpin-dashboard-${{ github.run_number }}
          path: dist
          retention-days: 30

      - name: Commit published data and source evidence
        if: always() && hashFiles('dist/release.json') != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/history.json
          if [ -d data/source/latest ]; then git add data/source/latest; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): daily selection update [skip ci]"
          git push origin HEAD:feature/catalog-sync-dashboard

      - name: Report failed source or validation stage
        if: always() && steps.pipeline.outcome == 'failure'
        run: exit 1
