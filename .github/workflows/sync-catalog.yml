name: Sync selection catalog

on:
  push:
    branches:
      - feature/catalog-sync-dashboard
  schedule:
    # GitHub Actions uses UTC. 19:15 UTC = 03:15 Asia/Shanghai next day.
    - cron: '15 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selection-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and validate catalog
        run: npm run sync

      - name: Run tests
        run: npm test

      - name: Build internal dashboard
        run: npm run build

      - name: Upload internal dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuanpin-dashboard-${{ github.run_number }}
          path: dist
          retention-days: 30

      - name: Commit validated catalog changes
        if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          catalog_changed="$(node -e "process.stdout.write(String(require('./public/data/sync-meta.json').catalogChanged))")"
          if [ "$catalog_changed" != "true" ]; then
            echo "Catalog content is unchanged; no data commit is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json public/data/sync-meta.json public/data/products.csv public/data/selection-report.md data/history.json
          git commit -m "chore(data): sync selection catalog [skip ci]"
          git push
